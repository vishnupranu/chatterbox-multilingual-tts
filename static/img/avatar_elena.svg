<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <!-- Outer Cyber Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-dasharray="12 6" opacity="0.8"/>
  <!-- Head & Hair Silhouette -->
  <path d="M70 70 C70 45, 130 45, 130 70 C135 90, 135 110, 125 125 C115 135, 85 135, 75 125 C65 110, 65 90, 70 70 Z" fill="#18181b" />
  <!-- Hair Wave -->
  <path d="M65 65 C60 35, 140 30, 135 65 C130 50, 100 45, 65 65 Z" fill="url(#neonCyan)" opacity="0.9"/>
  <!-- Glasses Frame -->
  <rect x="74" y="82" width="22" height="15" rx="3" fill="none" stroke="#e0e7ff" stroke-width="2.5" />
  <rect x="104" y="82" width="22" height="15" rx="3" fill="none" stroke="#e0e7ff" stroke-width="2.5" />
  <line x1="96" y1="88" x2="104" y2="88" stroke="#e0e7ff" stroke-width="2.5" />
  <!-- Cyber Interface Headset -->
  <circle cx="132" cy="92" r="7" fill="url(#neonPink)" />
  <path d="M132 92 Q145 110 120 120" fill="none" stroke="url(#neonPink)" stroke-width="2" />
  <!-- Shoulders / Cyber Suit -->
  <path d="M45 180 C50 145, 85 140, 100 140 C115 140, 150 145, 155 180 Z" fill="#27272a" />
  <path d="M85 142 L100 160 L115 142" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
</svg>