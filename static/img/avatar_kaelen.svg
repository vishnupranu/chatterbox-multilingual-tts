  <circle cx="115" cy="88" r="3" fill="url(#neonAmber)" />
  <!-- Glasses side bridge -->
  <line x1="80" y1="88" x2="105" y2="88" stroke="#71717a" stroke-width="2" />
  <!-- Cyber Neck Collar -->
  <path d="M50 180 C55 145, 80 142, 100 142 C120 142, 145 145, 150 180 Z" fill="#27272a" />
