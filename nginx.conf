# ==============================================================================
# Chatterbox Multilingual TTS - Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream chatterbox_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets & Frontend UI
    location /static/ {
        alias /var/www/chatterbox-multilingual-tts/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Synthesized Audio Streaming Cache
    location /static/audio_output/ {
        alias /var/www/chatterbox-multilingual-tts/static/audio_output/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Accept-Ranges bytes;
        expires 1d;
    }

    # API & Application Routing
    location / {
        proxy_pass http://chatterbox_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Long Polling support for Workers & Live Synthesis
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
