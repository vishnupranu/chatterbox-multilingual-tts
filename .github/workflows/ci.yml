name: Chatterbox Multilingual TTS CI/CD Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Subsystem Pre-Flight Audit & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv venv --python 3.11
          source .venv/bin/activate
          uv pip install -e resemble_chatterbox
          uv pip install fastapi uvicorn soundfile pywebview

      - name: Run 18-Subsystem Automated Audit Test Suite
        run: |
          source .venv/bin/activate
          ./run_tests.sh
